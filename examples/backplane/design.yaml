        pins: { "1": D10, "2": VCC }
      R12:
        part: R_10K_0603
        role: termination
        reason: Holds D11 at a defined level when nothing on the bus is driving it.
        pins: { "1": D11, "2": VCC }
      R13:
        part: R_10K_0603
        role: termination
        reason: Holds CLK at a defined level when nothing on the bus is driving it.
        pins: { "1": CLK, "2": VCC }
      R14:
