          and the card slides in it, so neither a part nor copper may be under it.
          This rail and the north one leave the 4.0 mm channel across the middle of
          the board that every line on the bus has to cross.
      - region_mm: [45.0, 30.0, 49.0, 56.0]
        reason: Card guide 2, north rail -- the other half of the same guide.
      - region_mm: [67.0, 0, 71.0, 26.0]
        reason: Card guide 3, south rail. The guide is bolted through the board
          and the card slides in it, so neither a part nor copper may be under it.
          This rail and the north one leave the 4.0 mm channel across the middle of
