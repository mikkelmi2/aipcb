board:
  # The mechanical boundary, in the board's own frame: millimetres, Y up,
  # origin at the bottom-left corner. See docs/format.md.
  #
  # A card cage's backplane is long and shallow -- the cards stand off it, so its
  # own height is set by the connector and by nothing else. A 1x20 vertical header
  # is 51.8 mm from courtyard to courtyard, which is where 56.0 mm comes from, and it is
  # also why the channels are as narrow as they are. There is no spare height on
  # this board to give them.
  origin: bottom_left
  outline:
    rect: [190.0, 56.0]

placement:
  # Every connector is pinned. On a board whose whole subject is what fits through
  # the gaps between them, where they sit *is* the example, and leaving it to the
  # packer would make the demonstration depend on a heuristic.
  J1:
    fixed: { x: 14.0, y: 52.22, rot: 0 }
    reason: The host ribbon lands at the west end, clear of the first card guide.
  J2:
    fixed: { x: 5.0, y: 30.0, rot: 0 }
    reason: The supply loom enters west of the ribbon, in the strip of board left
      over between the outline and the host connector's courtyard.
  slot1.J:
    fixed: { x: 36.0, y: 52.22, rot: 0 }
    reason: Card position 1, on the cage's 22.0 mm slot pitch. The pitch is the
      cage's and not the board's -- it is what leaves 18.46 mm between one
      connector's courtyard and the next, and the card guide takes 4.0 mm of that.
  slot2.J:
    fixed: { x: 58.0, y: 52.22, rot: 0 }
    reason: Card position 2, on the cage's 22.0 mm slot pitch. The pitch is the
      cage's and not the board's -- it is what leaves 18.46 mm between one
      connector's courtyard and the next, and the card guide takes 4.0 mm of that.
  slot3.J:
    fixed: { x: 80.0, y: 52.22, rot: 0 }
    reason: Card position 3, on the cage's 22.0 mm slot pitch. The pitch is the
      cage's and not the board's -- it is what leaves 18.46 mm between one
      connector's courtyard and the next, and the card guide takes 4.0 mm of that.
  slot4.J:
    fixed: { x: 102.0, y: 52.22, rot: 0 }
    reason: Card position 4, on the cage's 22.0 mm slot pitch. The pitch is the
      cage's and not the board's -- it is what leaves 18.46 mm between one
      connector's courtyard and the next, and the card guide takes 4.0 mm of that.
  slot5.J:
    fixed: { x: 124.0, y: 52.22, rot: 0 }
    reason: Card position 5, on the cage's 22.0 mm slot pitch. The pitch is the
      cage's and not the board's -- it is what leaves 18.46 mm between one
      connector's courtyard and the next, and the card guide takes 4.0 mm of that.
  slot6.J:
    fixed: { x: 146.0, y: 52.22, rot: 0 }
    reason: Card position 6, on the cage's 22.0 mm slot pitch. The pitch is the
      cage's and not the board's -- it is what leaves 18.46 mm between one
      connector's courtyard and the next, and the card guide takes 4.0 mm of that.

layout:
  stackup:
    copper_layers: 4
    thickness_mm: 1.6
    finish: HASL
    planes:
      - layer: In1.Cu
        net: GND
        reason: The return for a bus that spans 180 mm and six connectors. On the
          outer layers it would have to cross every card guide with the signals;
          here it crosses nothing.
      - layer: In2.Cu
        net: VCC
        reason: The rail, for the same reason. Six cards' supply current through a
          channel already holding sixteen signals is not a trade worth making.
    via_types: [through]
  placement:
    margin_mm: 2.0
    keepouts:
      - region_mm: [23.0, 0, 27.0, 26.0]
        reason: Card guide 1, south rail. The guide is bolted through the board
          and the card slides in it, so neither a part nor copper may be under it.
          This rail and the north one leave the 4.0 mm channel across the middle of
          the board that every line on the bus has to cross.
      - region_mm: [23.0, 30.0, 27.0, 56.0]
        reason: Card guide 1, north rail -- the other half of the same guide.
      - region_mm: [45.0, 0, 49.0, 26.0]
