      - members: [slot6.C]
        region_mm: [148.5, 44.0, 154.5, 53.0]
        reason: Card position 6's decoupling, in the strip between its connector
          and the guide east of it. The packer would otherwise put it wherever
          there was room, which on this board is inside a card guide.
      - members: [term.R1, term.R2, term.R3, term.R4, term.R5, term.R6, term.R7, term.R8, term.R9, term.R10, term.R11, term.R12, term.R13, term.R14, term.R15, term.R16]
        region_mm: [164.0, 3.0, 188.0, 53.0]
        reason: The terminator field takes the east end, past the last card guide,
          where there is board left over and nothing else wants it. Where inside
          that rectangle each resistor sits does not matter and is not stated --
          this is the one part of the board the packer is allowed to arrange.

pours:
  - net: GND
    layer: In1.Cu
    scope: board
    priority: 0
    connect: thermal
    reason: The plane the stackup reserved. Declaring it under `stackup.planes`
      keeps signals off the layer; this is what actually puts copper there.
  - net: VCC
    layer: In2.Cu
    scope: board
    priority: 0
    connect: thermal
    reason: The rail, on its own layer, reaching all six card positions and the
      terminator field without crossing a card guide.
