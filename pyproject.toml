[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipcb"
version = "0.1.0"
description = "An AI-native schematic & PCB source format compiled to KiCad"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "shapely>=2.1",
]

# The floor is 3.12 and not 3.11 for a measured reason, not a stylistic one.
# CPython 3.12 changed `sum()` of floats to Neumaier compensated summation, and
# the router costs paths with `sum(math.dist(...))`. On 3.11 those costs differ
# in their last bits, the negotiated-congestion search takes a different branch,
# and a board that routes on 3.12 can fail to route on 3.11 -- measured, not
# theorised: see ADR 0013 Finding 4. Determinism is a promise this project makes,
# so the supported range is the range it holds over.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# Routing needs Shapely 2.1 for constrained Delaunay triangulation.
routing = ["shapely>=2.1"]

[project.scripts]
aipcb = "aipcb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aipcb", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Shapely ships no stubs. `types-shapely` drags in numpy stubs; the routing code
# annotates its own boundaries instead, which is cheaper than taking the
# dependency for the sake of a third party's types.
module = ["yaml", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
