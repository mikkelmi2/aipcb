[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipcb"
version = "0.1.0"
description = "An AI-native schematic & PCB source format compiled to KiCad"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "shapely>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# Routing needs Shapely 2.1 for constrained Delaunay triangulation.
routing = ["shapely>=2.1"]

[project.scripts]
aipcb = "aipcb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/aipcb"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Shapely ships no stubs, and `types-shapely` drags in numpy stubs that require
# python_version >= 3.12 — which would drop our 3.11 support to type-check a
# dependency. The routing code annotates its own boundaries instead.
module = ["yaml", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
